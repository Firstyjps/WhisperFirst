# whisperfirst.kronkasem.com — หน้าดาวน์โหลด WhisperFirst (static) · container `whisperfirst` (สร้างด้วย deploy/run-container.sh)
# container เห็นแค่ ~/projects/whisperfirst/site (releases/<stamp> + current) — ไม่เห็น conf/backup อื่นในโฟลเดอร์โปรเจกต์
# security headers อยู่ใน headers.conf (include ทุก location — add_header ใน location ทับค่าระดับ server)
server {
  listen 80;
  server_name _;
  root /srv/site/current;
  index index.html;
  server_tokens off;
  charset utf-8;
  autoindex off;

  gzip on;
  gzip_vary on;   # cache กลางทางต้องแยกฉบับบีบอัด/ไม่บีบอัด
  gzip_comp_level 6;
  gzip_min_length 1024;
  gzip_types application/javascript text/javascript text/css image/svg+xml;

  # ไฟล์ซ่อน (.git, .env, .DS_Store …) ไม่เสิร์ฟเด็ดขาด
  location ~ /\. {
    include /etc/nginx/wf-headers.conf;
    return 404;
  }
  location = /download/WhisperFirst.dmg {
    types { } default_type application/x-apple-diskimage;
    include /etc/nginx/wf-headers.conf;
    add_header Content-Disposition "attachment; filename=\"WhisperFirst.dmg\"" always;
    add_header Cache-Control "no-cache" always;
  }
  location / {
    include /etc/nginx/wf-headers.conf;
    add_header Cache-Control "no-cache" always;
    try_files $uri $uri/index.html =404;   # โฟลเดอร์ที่ไม่มี index → 404 (ไม่ใช่ 403)
  }
}
