# whisperfirst.kronkasem.com — หน้าดาวน์โหลด WhisperFirst (static) · container `whisperfirst` · deploy: ~/projects/whisperfirst/{releases/<stamp>,current}
# security headers อยู่ใน headers.conf (include ทุก location)
server {
  listen 80;
  server_name _;
  root /srv/whisperfirst/current;
  index index.html;
  server_tokens off;
  charset utf-8;

  gzip on;
  gzip_comp_level 6;
  gzip_min_length 1024;
  gzip_types application/javascript text/javascript text/css image/svg+xml;

  location = /download/WhisperFirst.dmg {
    types { } default_type application/x-apple-diskimage;
    include /srv/whisperfirst/headers.conf;
    add_header Content-Disposition "attachment; filename=\"WhisperFirst.dmg\"" always;
    add_header Cache-Control "no-cache" always;
  }
  location / {
    include /srv/whisperfirst/headers.conf;
    add_header Cache-Control "no-cache" always;
    try_files $uri $uri/ =404;
  }
}
