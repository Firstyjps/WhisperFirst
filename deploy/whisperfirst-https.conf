# whisperfirst.kronkasem.com — WhisperFirst download page (container whisperfirst). Hand-made conf, not in the NPM DB
# cert via certbot webroot, renewed daily by ~/bin/handcert-renew.sh (NPM only renews certs in its DB).
server {
  listen 80;
  listen [::]:80;
  server_name whisperfirst.kronkasem.com;
  include conf.d/include/letsencrypt-acme-challenge.conf;
  location / { return 301 https://$host$request_uri; }
}
server {
  listen 443 ssl;
  listen [::]:443 ssl;
  server_name whisperfirst.kronkasem.com;
  http2 on;
  include conf.d/include/letsencrypt-acme-challenge.conf;
  include conf.d/include/ssl-cache.conf;
  include conf.d/include/ssl-ciphers.conf;
  ssl_certificate /etc/letsencrypt/live/whisperfirst.kronkasem.com/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/whisperfirst.kronkasem.com/privkey.pem;
  add_header Strict-Transport-Security "max-age=63072000" always;
  include conf.d/include/block-exploits.conf;
  access_log /data/logs/proxy-host-whisperfirst_access.log proxy;
  error_log /data/logs/proxy-host-whisperfirst_error.log warn;
  location / {
    set $whisperfirst_upstream whisperfirst;
    resolver 127.0.0.11 valid=30s;
    proxy_pass http://$whisperfirst_upstream:80;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }
}
